server:
  port: 8080

spring:
  application:
    name: knot-admin
  # ⚠ 这里**刻意不设默认 profile**（2026-11-11 安全修正）。
  #
  # 原配置是 `profiles.active: local`，而两个启动守卫（BootstrapSecurityGuard /
  # SqlInitModeGuard）都把 local 视为非生产 → 「漏设 profile」的部署会带着
  # application-local.yml 里的默认库口令、开发加密密钥、KNOT_SQL_INIT_MODE=ALWAYS
  # 和种子管理员正常启动，即 fail-open。
  #
  # 现在不设默认：
  #   本地开发   `--spring.profiles.active=local`（README 与 av_smoke_run.sh 本就显式传）
  #   生产       `SPRING_PROFILES_ACTIVE=prod` + 注入 KNOT_* 密钥（见 Dockerfile 注释）
  #   两者都没设 → 无数据源、且守卫判定为非生产缺失 → 直接启不来（fail-closed）。
  # 不要为了「本地少打一个参数」把这行加回来。

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  reasonable: true
  helper-dialect: mysql
  default-count: true

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  # 管理端 HTTP 契约只由本模块 controller 定义（svc/adapter/plugin 均无端点）。
  # 包迁移时此字符串不参与编译校验，指错会让 /api/docs/openapi.json 变成空文档——
  # 该失败是可见的（文档为空），由真启冒烟核对 paths 数量兜住。
  packages-to-scan: org.chobit.knot.admin.controller
  default-flat-param-object: true

# ── 可观测性（Actuator）─────────────────────────────────────────────────────
# 管理端需要 health 探针供编排/存活检查使用；同样只暴露最小端点集，避免泄漏配置。
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}

