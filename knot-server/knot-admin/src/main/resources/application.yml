server:
  port: 8080

spring:
  application:
    name: knot-admin
  profiles:
    active: local

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  reasonable: true
  helper-dialect: mysql
  default-count: true

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  # 管理端 HTTP 契约只由本模块 controller 定义（svc/adapter/plugin 均无端点）。
  # 包迁移时此字符串不参与编译校验，指错会让 /api/docs/openapi.json 变成空文档——
  # 该失败是可见的（文档为空），由真启冒烟核对 paths 数量兜住。
  packages-to-scan: org.chobit.knot.admin.controller
  default-flat-param-object: true

# ── 可观测性（Actuator）─────────────────────────────────────────────────────
# 管理端需要 health 探针供编排/存活检查使用；同样只暴露最小端点集，避免泄漏配置。
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}

