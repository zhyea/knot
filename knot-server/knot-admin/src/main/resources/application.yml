server:
  port: 8080

spring:
  application:
    name: knot-admin
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/knot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 账号口令一律支持外部注入；默认值为本机开发库，生产部署必须覆盖
    username: ${KNOT_DB_USERNAME:admin}
    password: ${KNOT_DB_PASSWORD:admin}
  sql:
    init:
      # 生产部署应设 KNOT_SQL_INIT_MODE=NEVER，避免每次启动重复执行 schema/data
      mode: ${KNOT_SQL_INIT_MODE:ALWAYS}
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
      continue-on-error: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  reasonable: true
  helper-dialect: mysql
  default-count: true

# 供应商/应用凭证库内加密密钥（生产必须用环境变量 KNOT_CREDENTIAL_ENCRYPTION_KEY 覆盖，
# 否则启动日志会打印开发默认值告警）
knot:
  credential:
    encryption-key: ${KNOT_CREDENTIAL_ENCRYPTION_KEY:knot-dev-credential-encryption-key}

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: org.chobit.knot.gateway.controller
  default-flat-param-object: true

# ── 可观测性（Actuator）─────────────────────────────────────────────────────
# 管理端需要 health 探针供编排/存活检查使用；同样只暴露最小端点集，避免泄漏配置。
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}

