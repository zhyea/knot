server:
  port: 9090

spring:
  application:
    name: knot-gateway
  # ── 容器：Netty（2026-10-20 批2 起）──────────────────────────────────────
  # 原来的 spring.mvc.async.request-timeout（600s）已删除：Servlet 栈的异步超时是
  # 「流式长连接」的唯一兜底，换 Netty 后这条线改由两处承担：
  #   ① 非流式 / 响应就绪前 → knot.gateway.upstream.request-budget（Mono.timeout → 504）
  #   ② 流式响应体 → 客户端断连即自动取消，不受总预算约束（长回答不能被 600s 掐断）
  webflux:
    multipart:
      # 多模态上传（图片 / 音频 / 视频）的解析上限。WebFlux 的 multipart 没有
      # spring.servlet.multipart 那套 max-request-size，只有「单 part 阈值」：
      # 内存内直通到该阈值，超出后落磁盘（不再整包读进内存）。
      max-in-memory-size: 1MB
      max-disk-usage-per-part: 10MB
      max-parts: 16
      max-headers-size: 8KB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/knot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 账号口令一律支持外部注入；默认值为本机开发库，生产部署必须覆盖
    username: ${KNOT_DB_USERNAME:admin}
    password: ${KNOT_DB_PASSWORD:admin}
  data:
    redis:
      # 切到 redis 档时才真正建立连接（连接惰性建立，未切档时零连接开销）。
      # ⚠ 生产必须覆盖 host / port 与密码；默认值只是本机开发便利。
      host: ${KNOT_REDIS_HOST:127.0.0.1}
      port: ${KNOT_REDIS_PORT:6379}
      password: ${KNOT_REDIS_PASSWORD:}
      # 单次命令超时：超时即判定存储不可用 → 抛 RedisUnavailableException → 503 + ERROR 报警
      timeout: ${KNOT_REDIS_TIMEOUT:2s}
      # 建连超时：连接建不起来时快速失败，别把请求线程吊在等连接上
      connect-timeout: ${KNOT_REDIS_CONNECT_TIMEOUT:2s}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# ── Kafka 事件输出（网关流量事件，供数仓消费）────────────────────────────────
# ⚠ 默认关闭：关闭时 gateway 不装配任何 Kafka 组件，行为与开启前逐字一致。
# 开启后必须配 bootstrap-servers，否则启动失败（不允许出现“不知道往哪发”的静默管道）。
# 生产者只写必需项（地址 + 序列化器 + 等待封顶），其余客户端参数一律走 Kafka 默认值。
# 请求入口 + 处置结果合并为单条消息（knot.gateway.traffic/1.0），终态一次发出。
kafka:
  enabled: ${KAFKA_ENABLED:false}
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
  # 主题写全名（不拼前缀）：契约版本在消息的 schema 字段里演进，主题名保持稳定
  topic:
    traffic: ${KAFKA_TOPIC:knot-gateway-traffic-event}
  # 投递失败时的本地死信文件（JSONL，append）；默认开启——直推失败即落盘，数据不能丢。
  # 留空表示不落盘，只在日志里计数告警
  dlq-path: ${KAFKA_DLQ_PATH:logs/kafka-dlq}

logging:
  pattern:
    level: "%5p [%X{traceId:-}-%X{spanId:-}]"

knot:
  # 必须与 knot-admin 保持一致：凭证密文由该口令派生密钥加解密
  credential:
    encryption-key: ${KNOT_CREDENTIAL_ENCRYPTION_KEY:knot-dev-credential-encryption-key}
  # ── 运行时存储选型（2026-10-15）─────────────────────────────────────────
  # traffic / load 两个需要跨节点共享的运行时存储（频控计数 / 在途负载）各自持有
  # store 选型（默认 caffeine；多节点全局口径切 redis），共用 Redis 门面 RedisCache。
  # 存储选型是业务域自己的属性，配置直接挂在域下，不设独立的 cache 中间层；
  # 模式归一见 StoreModeResolver（怪值启动失败，不静默按单节点跑）。
  #
  # 故障口径：redis 档一律 fail-hard —— Redis 不可用时抛 RedisUnavailableException
  # → 网关 503 + ERROR 日志报警，不静默降级到本地缓存（那会造成限额外发等看不见的损失）。
  traffic:
    # caffeine（单节点，默认）/ redis（多节点全局，fail-hard）
    store: ${KNOT_TRAFFIC_STORE:caffeine}
    # 键前缀：多环境共用同一 Redis 时用于隔离
    key-prefix: ${KNOT_TRAFFIC_KEY_PREFIX:knot:traffic}
    # 日 / 月额度窗口换算所用时区，多节点必须配置成同一个值
    zone: ${KNOT_TRAFFIC_ZONE:Asia/Shanghai}
    # caffeine 存储的最大条目数
    maximum-size: ${KNOT_TRAFFIC_MAXIMUM_SIZE:200000}
  load:
    store: ${KNOT_LOAD_STORE:caffeine}
    key-prefix: ${KNOT_LOAD_KEY_PREFIX:knot:load}
    # 在途计数存活时间（秒）
    ttl-seconds: ${KNOT_LOAD_TTL_SECONDS:300}
    maximum-size: ${KNOT_LOAD_MAXIMUM_SIZE:20000}
  gateway:
    cors:
      # 管理端流式调试直连网关时使用；生产环境请通过配置覆盖
      allowed-origins: ${KNOT_GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    # ── 上游调用：连接池与超时（默认集中在 GatewayUpstreamClientProperties）──────────
    # 以下为可调上限的 env 覆盖示例；不写则走 Java 侧默认值。
    # upstream:
    #   # TCP + TLS 建连超时：上游不可达时快速失败并交给 failover
    #   connect-timeout: ${KNOT_UPSTREAM_CONNECT_TIMEOUT:5s}
    #   # 连接池耗尽时等待空闲连接的超时；超时即抛错，避免请求无限排队
    #   connection-request-timeout: ${KNOT_UPSTREAM_CONN_REQ_TIMEOUT:5s}
    #   # 相邻两次网络读之间的最大静默时间（流式靠它卡静默，非完整响应时长）
    #   read-timeout: ${KNOT_UPSTREAM_READ_TIMEOUT:120s}
    #   # 总响应超时：整段交互上限，堵住「每 100s 滴 1B」的慢速滴流（流式只卡到响应头，安全）
    #   response-timeout: ${KNOT_UPSTREAM_RESPONSE_TIMEOUT:120s}
    #   # 单条连接最长存活时间
    #   time-to-live: ${KNOT_UPSTREAM_TTL:5m}
    #   # 池中连接最长空闲时间，超过即回收（下限无；0 表示不回收）
    #   max-idle-time: ${KNOT_UPSTREAM_MAX_IDLE:10s}
    #   # 连接池总连接数上限（下限 1，误配 0 启动即失败）。
    #   # ⚠ 2026-10-20 迁移 reactor-netty 后不再有 per-route 上限：连接池按 host 分片但共享本总上限
    #   max-total-connections: ${KNOT_UPSTREAM_MAX_TOTAL:200}
    #   # 流式读写缓冲区大小（字节，下限 1）
    #   stream-buffer-size: ${KNOT_UPSTREAM_STREAM_BUF:8192}
    #   # 是否接受上游 gzip/br 压缩响应（默认关：与流式低延迟目标冲突）
    #   content-compression-enabled: ${KNOT_UPSTREAM_CONTENT_COMPRESSION:false}
    #   # 异步化承载线程池大小（B1：控制器返回 DeferredResult 后，上游代理链路在此执行，Tomcat worker 立即释放；下限 1）
    #   async-executor-threads: ${KNOT_UPSTREAM_ASYNC_THREADS:200}
    #   # 全局请求预算 deadline（B2：唯一真总超时，流式/非流式统一；到点返回 504）
    #   request-budget: ${KNOT_UPSTREAM_REQUEST_BUDGET:600s}
    # ── 用量提取失败口径（默认值集中在 UsageExtractionProperties）──────────────
    # 只管「提取不出用量」时是中断响应还是放行出零账；提取口径本身由绑定在模型上的
    # extractor 决定，不在这里配。
    # false（默认）：抛异常中断响应 —— 静默零账等于这笔上游消耗永远收不回，且只在对账时才暴露。
    # true：记 ERROR 后放行、出零账，并保留上游原文供事后重算 —— 用计费准确性换可用性。
    # ⚠ 未知 extractor code 不受本项影响，恒 fail-fast：那是配置错误而非提取失败，
    #   降级它会让该绑定下的所有请求永久零账且没有自愈路径。
    usage:
      # true = 降级放行 / false = 中断响应（宽松行为必须显式打开）
      degrade-on-failure: ${KNOT_GATEWAY_USAGE_DEGRADE_ON_FAILURE:false}
  outage:
    # 异常摘除：纯进程内 Caffeine，无 store 开关。摘除是本节点自己的异常观察，
    # 不需要跨节点共享；放 Redis 反而让 Redis 故障同时打掉网关的自我保护能力。
    key-prefix: ${KNOT_OUTAGE_KEY_PREFIX:knot:outage}
    # 条目自然回收宽限（毫秒）：追加在最晚的窗口/摘除/探活到期时刻之后
    expire-grace-ms: ${KNOT_OUTAGE_EXPIRE_GRACE_MS:60000}
    maximum-size: ${KNOT_OUTAGE_MAXIMUM_SIZE:20000}
    admin-api:
      # 管理面 API（/_admin/outages*）总开关；false 时端点整体 404
      enabled: ${KNOT_OUTAGE_ADMIN_API_ENABLED:true}
      # 管理面共享令牌：未配置时仅允许 loopback 访问；多节点部署必须配置
      token: ${KNOT_GATEWAY_ADMIN_TOKEN:}

# ── 可观测性（Actuator + Prometheus）────────────────────────────────────────
# 网关是「限流 / 额度 / 摘除 / 重试 / failover」的唯一决策发生地，而这些决策在正常路径上
# 全是静默的——没有指标等于线上盲飞：限流是否误伤、某个上游是否持续被摘除，都观测不到。
#
# ⚠ 默认只暴露 health / info / prometheus / metrics 四个端点：其余（env / beans /
#   threaddump / heapdump 等）一律不暴露，避免泄漏配置、凭据与内部结构。
# ⚠ 生产部署必须由反向代理限制 /actuator/* 仅内网（或监控采集器）可达。
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
  endpoint:
    health:
      # 默认不展开明细（含数据库/Redis 连接信息）；排障时可临时改为 when_authorized
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 代理耗时按直方图分桶，便于算 P95/P99；SLO 边界用于直接看达标率
      percentiles-histogram:
        knot.gateway.proxy.latency: ${KNOT_METRICS_PROXY_HISTOGRAM:true}
      slo:
        knot.gateway.proxy.latency: ${KNOT_METRICS_PROXY_SLO:1s,5s,30s}
