server:
  port: 9090

spring:
  application:
    name: knot-gateway
  mvc:
    async:
      # 流式转发走 Servlet 异步写，超时过小会直接掐断长流（容器默认仅 30s）
      request-timeout: 600s
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/knot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 账号口令一律支持外部注入；默认值为本机开发库，生产部署必须覆盖
    username: ${KNOT_DB_USERNAME:root}
    password: ${KNOT_DB_PASSWORD:12345678}
  quartz:
    auto-startup: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-} spanId:%X{spanId:-}]"

knot:
  # 必须与 knot-admin 保持一致：凭证密文由该口令派生密钥加解密
  credential:
    encryption-key: ${KNOT_CREDENTIAL_ENCRYPTION_KEY:knot-dev-credential-encryption-key}
  plugin:
    sink:
      kafka:
        enabled: false
        topic-prefix: knot.plugin
        bootstrap-servers: ${KNOT_PLUGIN_KAFKA_BOOTSTRAP_SERVERS:}
  gateway:
     cors:
      # 管理端流式调试直连网关时使用；生产环境请通过配置覆盖
      allowed-origins: ${KNOT_GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
     upstream:
      # 上游 HTTP 客户端：Apache HttpClient 5 连接池 + 有界超时
      connect-timeout: 5s
      connection-request-timeout: 5s
      # Socket 读超时 = 相邻两个数据包之间的最大静默时间，不是整个响应的总时长
      read-timeout: 120s
      time-to-live: 5m
      validate-after-inactivity: 10s
      max-total-connections: 200
      max-connections-per-route: 50
      streaming-enabled: true
      stream-buffer-size: 8192
      content-compression-enabled: false
