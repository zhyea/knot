server:
  port: 9090

spring:
  application:
    name: knot-gateway
  profiles:
    active: local

  # ── 容器：Netty（2026-10-20 批2 起）──────────────────────────────────────
  # 原来的 spring.mvc.async.request-timeout（600s）已删除：Servlet 栈的异步超时是
  # 「流式长连接」的唯一兜底，换 Netty 后这条线改由两处承担：
  #   ① 非流式 / 响应就绪前 → knot.gateway.upstream.request-budget（Mono.timeout → 504）
  #   ② 流式响应体 → 客户端断连即自动取消，不受总预算约束（长回答不能被 600s 掐断）
  webflux:
    multipart:
      # 多模态上传（图片 / 音频 / 视频）的解析上限。WebFlux 的 multipart 没有
      # spring.servlet.multipart 那套 max-request-size，只有「单 part 阈值」：
      # 内存内直通到该阈值，超出后落磁盘（不再整包读进内存）。
      max-in-memory-size: 1MB
      max-disk-usage-per-part: 10MB
      max-parts: 16
      max-headers-size: 8KB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true


logging:
  pattern:
    level: "%5p [%X{traceId:-}-%X{spanId:-}]"

# ── 可观测性（Actuator + Prometheus）────────────────────────────────────────
# 网关是「限流 / 额度 / 摘除 / 重试 / failover」的唯一决策发生地，而这些决策在正常路径上
# 全是静默的——没有指标等于线上盲飞：限流是否误伤、某个上游是否持续被摘除，都观测不到。
#
# ⚠ 默认只暴露 health / info / prometheus / metrics 四个端点：其余（env / beans /
#   threaddump / heapdump 等）一律不暴露，避免泄漏配置、凭据与内部结构。
# ⚠ 生产部署必须由反向代理限制 /actuator/* 仅内网（或监控采集器）可达。
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
  endpoint:
    health:
      # 默认不展开明细（含数据库/Redis 连接信息）；排障时可临时改为 when_authorized
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 代理耗时按直方图分桶，便于算 P95/P99；SLO 边界用于直接看达标率
      percentiles-histogram:
        knot.gateway.proxy.latency: ${KNOT_METRICS_PROXY_HISTOGRAM:true}
      slo:
        knot.gateway.proxy.latency: ${KNOT_METRICS_PROXY_SLO:1s,5s,30s}
